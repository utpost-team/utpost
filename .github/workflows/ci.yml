name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          path: client/dist
  # M5: integrationstesterna i api/ mot riktiga databaser. Postgres och Mongo startas som
  # services för jobbet och nås på localhost (inte postgres/mongo som i compose, och 5432 –
  # inte 5433 som på din dator). De är tomma tills seed och migrate:logs har körts.
  integration:
    name: Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16 # samma som compose.yml
        env:
          POSTGRES_USER: utpost
          POSTGRES_PASSWORD: utpost
          POSTGRES_DB: utpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utpost -d utpost"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      mongo:
        image: mongo:8.2 # samma som compose.yml
        env:
          MONGO_INITDB_ROOT_USERNAME: utpost
          MONGO_INITDB_ROOT_PASSWORD: utpost
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      # Samma variabler som compose sätter för api – men här är databaserna på localhost.
      DATABASE_URL: postgres://utpost:utpost@localhost:5432/utpost
      MONGO_URL: mongodb://utpost:utpost@localhost:27017/utpost?authSource=admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run seed # tomma tabeller → testdata, exakt som lokalt
      - run: npm run migrate:logs # mätpunkterna till Mongo, och avslutar med felkod om antalen inte stämmer
      - run: npm run test:api
  image:
    name: Image
    runs-on: ubuntu-latest
    # Ingen image av kod som inte klarat kontrollerna – och inte av ett API vars
    # integrationstester är röda: imagen är precis det som testerna testar.
    needs: [quality, build, integration]
    permissions:
      contents: read
      packages: write # bara det här jobbet får publicera i GHCR
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Inloggning behövs bara när vi ska publicera, alltså vid push till main.
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Namn och tagg: ghcr.io/<ägare>/<repo>-api:sha-1a2b3c4 (metadata-action gör namnet till gemener).
      - id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: type=sha
      - uses: docker/build-push-action@v6
        with:
          context: . # repots rot, som i compose.yml
          file: api/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }} # M6: syns i /api/health – deploysteget väntar på den
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - id: meta-client
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-client
          tags: type=sha
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: client/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta-client.outputs.tags }}
          labels: ${{ steps.meta-client.outputs.labels }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  # M6: merge till main → staging i Azure Container Apps kör den nya imagen.
  # Jobbet bygger ingenting – det byter image i en app som redan finns (infra/azure/skapa-staging.sh),
  # väntar tills /api/health svarar med rätt sha, och röktestar GraphQL genom nginx.
  deploy:
    name: Deploy → Azure staging
    runs-on: ubuntu-latest
    needs: [image, integration] # samma image som Image publicerade; aldrig en deploy av kod med röda API-tester
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: azure-staging # variablerna (id:n och adressen) ligger på miljön, inte i repot
      url: ${{ vars.AZURE_URL }}
    permissions:
      id-token: write # får be GitHub om en kortlivad OIDC-token – det finns ingen lösenordshemlighet
      contents: read
    concurrency:
      group: deploy-staging
      cancel-in-progress: false # två deployer i rad får köa, inte avbryta varandra
    steps:
      - name: Logga in i Azure med GitHubs identitet (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Byt image på api och client – exakt den här committen
        env:
          RG: ${{ vars.AZURE_RG }}
          APP: ${{ vars.AZURE_APP }}
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          REPO="${GITHUB_REPOSITORY,,}"                        # GHCR kräver gemener
          TAG="sha-${GITHUB_SHA::7}"                           # samma tagg som docker/metadata-action satte i Image
          # --container-name tar en container per anrop → två anrop, två revisioner (den första kör
          # ny api med gammal client några sekunder). Suffixen gör namnen förutsägbara – och ett
          # suffix går bara att använda en gång: en omkörning av jobbet kräver en ny commit.
          az containerapp update --name "$APP" --resource-group "$RG" \
            --container-name api --image "ghcr.io/${REPO}-api:${TAG}" \
            --revision-suffix "${TAG}-api" --output none
          az containerapp update --name "$APP" --resource-group "$RG" \
            --container-name client --image "ghcr.io/${REPO}-client:${TAG}" \
            --revision-suffix "${TAG}" \
            --query properties.latestRevisionName --output tsv

      - name: Vänta tills staging kör den här committen
        env:
          URL: ${{ vars.AZURE_URL }}
          RG: ${{ vars.AZURE_RG }}
          APP: ${{ vars.AZURE_APP }}
        run: |
          URL="${URL%/}"
          TAG="sha-${GITHUB_SHA::7}"
          for i in $(seq 1 30); do
            # Anropet går genom nginx i client-containern – svarar health med rätt sha är hela kedjan uppe.
            LIVE=$(curl -fsS --max-time 20 "$URL/api/health" 2>/dev/null | sed -n 's/.*"sha":"\([^"]*\)".*/\1/p' || true)
            # …och den revision som svarar ska vara den sista (client-uppdateringen), inte mellanrevisionen.
            REV=$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestReadyRevisionName --output tsv 2>/dev/null || true)
            if [ "$LIVE" = "$GITHUB_SHA" ] && [ "${REV##*--}" = "$TAG" ]; then
              echo "✅ $URL kör $GITHUB_SHA (revision $REV)"
              exit 0
            fi
            echo "Försök $i/30: staging kör ${LIVE:-(inget svar ännu – appen väcks från noll?)}, klar revision ${REV:-?}, väntar 10 s"
            sleep 10
          done
          echo "::error::Staging kör inte $GITHUB_SHA efter 5 minuter. Kolla Revisions and replicas i portalen, eller az containerapp logs show --container api."
          exit 1

      - name: Röktest – GraphQL genom nginx-proxyn
        env:
          URL: ${{ vars.AZURE_URL }}
        run: |
          URL="${URL%/}"
          SVAR=$(curl -fsS --max-time 20 "$URL/graphql" -H 'Content-Type: application/json' \
            -d '{"query":"{ tours(limit: 1) { id user { displayName } } }"}')
          echo "$SVAR"
          echo "$SVAR" | grep -q '"displayName"' || { echo "::error::GraphQL svarade utan data"; exit 1; }
          echo "✅ /graphql svarar via nginx, med data ur en seedad databas"

  # M7: merge till main → ny kod i bildfunktionen (Azure Functions, Flex Consumption).
  # Jobbet skapar ingenting – function-appen finns redan (infra/azure/skapa-funktion.sh). Det lägger
  # upp functions/ med sina produktionsberoenden och röktestar process-image med funktionsnyckeln.
  deploy-functions:
    name: Deploy → Azure Functions
    runs-on: ubuntu-latest
    needs: [quality] # functions/ har inga egna tester och ingen image – Quality räcker som spärr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: azure-staging # samma miljö och samma variabler som Deploy → Azure staging, plus AZURE_FUNCTION_APP
    permissions:
      id-token: write # samma identitet som M6: OIDC, ingen lösenordshemlighet och ingen publish profile
      contents: read
    concurrency:
      group: deploy-functions
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 } # samma Node som function-appen (skapa-funktion.sh: --runtime-version 22)

      # functions/ är ett eget paket, inte en workspace: beroendena ska ligga i functions/node_modules,
      # annars saknar deploypaketet @azure/functions och funktionen svarar inte.
      - name: Produktionsberoenden i functions/
        working-directory: functions
        run: npm ci --omit=dev

      - name: Logga in i Azure med GitHubs identitet (OIDC)
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Med OIDC-inloggning känner actionen själv av att appen är Flex Consumption. .funcignore styr
      # vad som inte följer med (local.settings.json, testerna).
      - name: Lägg upp functions/ i function-appen
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ vars.AZURE_FUNCTION_APP }}
          package: functions

      - name: Röktest – process-image med funktionsnyckeln
        env:
          RG: ${{ vars.AZURE_RG }}
          FN_APP: ${{ vars.AZURE_FUNCTION_APP }}
        run: |
          # Nyckeln hämtas här i jobbet och maskeras innan något kan skriva ut den – den finns
          # aldrig i repot eller som GitHub-secret.
          KEY=$(az functionapp keys list --name "$FN_APP" --resource-group "$RG" --query functionKeys.default --output tsv)
          echo "::add-mask::$KEY"
          HOST=$(az functionapp show --name "$FN_APP" --resource-group "$RG" --query "defaultHostName || properties.defaultHostName" --output tsv)
          URL="https://${HOST}/api/process-image"
          for i in $(seq 1 12); do
            # Direkt efter deployen startar värden om – då svarar den 404 tills funktionen är indexerad.
            SVAR=$(curl -fsS --max-time 30 -X POST "$URL" -H "x-functions-key: $KEY" \
              -H 'Content-Type: application/json' \
              -d '{"filename":"rok.jpg","width":4000,"height":3000}' 2>/dev/null || true)
            ANTAL=$(echo "$SVAR" | jq '.variants | length' 2>/dev/null || echo 0)
            if [ "$ANTAL" = "4" ]; then
              echo "$SVAR" | jq -c '{processingMs, coldStart, instance, node}'
              echo "✅ $URL svarar med fyra varianter"
              exit 0
            fi
            echo "Försök $i/12: inget giltigt svar ännu, väntar 10 s"
            sleep 10
          done
          echo "::error::process-image svarade inte med fyra varianter efter 2 minuter. Kolla loggströmmen för $FN_APP i portalen."
          exit 1
